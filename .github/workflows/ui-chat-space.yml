name: UI Chat Space

# Publishes Llama Chat, the app alone without a llama-server, to the static Hugging Face Space that the
# HF_SPACE_UI_CHAT variable names, whenever the UI changes on master. chat.llama.app is a custom domain of
# that Space, set in the Space's settings.
# Opt-in: it runs only in a repository that sets the variable, with a token that can write to the Space.

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths: [
      '.github/workflows/ui-chat-space.yml',
      'ui/apps/chat/**',
      'ui/lib/**'
    ]

cache-mode: none
permissions:
  contents: read

# one deploy at a time, and none is cut off halfway: the next one waits
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # runs the npm dependencies: this job gets no secret and no token that can write
  build:
    name: Build Llama Chat
    if: vars.HF_SPACE_UI_CHAT != ''
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Build
        working-directory: ui/apps/chat
        run: |
          npm ci
          npm run build

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: ui-chat-dist
          path: ui/apps/chat/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # holds the token, and runs no npm dependency: scripts/app-space.ts uses Node.js alone
  deploy:
    name: Deploy to the Space
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: ui-chat-dist
          path: ui/apps/chat/dist

      - name: Install Hugging Face Hub CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install -U huggingface_hub==1.28.0
          echo "$RUNNER_TEMP/hf/bin" >> "$GITHUB_PATH"

      - name: Deploy
        working-directory: ui/apps/chat
        env:
          HF_SPACE_UI_CHAT: ${{ vars.HF_SPACE_UI_CHAT }}
          # a token with write access to the Space; HF_TOKEN_UI_STATIC_OUTPUT if that one has it
          HF_TOKEN: ${{ secrets.HF_TOKEN_UI_CHAT || secrets.HF_TOKEN_UI_STATIC_OUTPUT }}
        run: node scripts/app-space.ts --built
